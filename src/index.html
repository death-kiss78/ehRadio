<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="img/ftp.svg">
<link rel="stylesheet" href="css/style.css">
<title>ESP32 File Manager (SD)</title>

<style>
body { font-family: Arial; background:#222; color:#eee; padding:20px; }
#path { font-weight:bold; margin-bottom:10px; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
td { padding:6px; border-bottom:1px solid #444; }
tr:hover { background:#333; cursor:pointer; }
button { margin:5px; padding:6px 12px; }
#pagination { margin-top:10px; }
</style>
</head>

<body>

<h2>ESP32 File Manager (SD)</h2>
<div id="storageStatus" style="margin:10px; font-size:14px; color:#ccc;">
    Checking storage...
</div>

<div id="path">/</div>

<button onclick="goUp()">⬆ Up</button>
<button onclick="mkdir()">📁 New Folder</button>

<input type="file" id="uploadInput">
<button onclick="uploadFile()">⬆ Upload</button>

<table id="fileTable"></table>
<div id="pagination"></div>

<script>
let currentPath = "/";
let page = 1;
const perPage = 25;
let fullList = [];

function api(url, callback) {
    fetch(url).then(r => r.text()).then(callback);
}

function loadDir(path = currentPath) {
    currentPath = path;
    document.getElementById("path").innerText = currentPath;
    page = 1;

    api(`/list_s?path=${encodeURIComponent(path)}`, data => {
        let list = JSON.parse(data);

        list.sort((a, b) => {
            if (a.type === "dir" && b.type !== "dir") return -1;
            if (a.type !== "dir" && b.type === "dir") return 1;
            return a.name.localeCompare(b.name);
        });

        fullList = list;
        renderPage();
    });
}

function renderPage() {
    let start = (page - 1) * perPage;
    let slice = fullList.slice(start, start + perPage);

    let html = "";
    slice.forEach(item => {
        html += `<tr onclick="itemClick('${item.name}', '${item.type}')">
                    <td>${item.type === "dir" ? "📁" : "📄"} ${item.name}</td>
                    <td>${item.type === "file" ? item.size + " bytes" : ""}</td>
                    <td>
                        <button onclick="event.stopPropagation(); renameItem('${item.name}')">Rename</button>
                        <button onclick="event.stopPropagation(); deleteItem('${item.name}')">Delete</button>
                        ${item.type === "file" ? `<button onclick="event.stopPropagation(); downloadItem('${item.name}')">Download</button>` : ""}
                    </td>
                 </tr>`;
    });

    document.getElementById("fileTable").innerHTML = html;
    renderPaginationControls();
}

function renderPaginationControls() {
    let totalPages = Math.ceil(fullList.length / perPage);
    if (totalPages <= 1) return document.getElementById("pagination").innerHTML = "";

    document.getElementById("pagination").innerHTML =
        `<button onclick="prevPage()" ${page===1?"disabled":""}>Prev</button>
         Page ${page} / ${totalPages}
         <button onclick="nextPage()" ${page===totalPages?"disabled":""}>Next</button>`;
}

function nextPage(){ if(page < Math.ceil(fullList.length/perPage)){ page++; renderPage(); } }
function prevPage(){ if(page > 1){ page--; renderPage(); } }

function itemClick(name, type) {
    if (type === "dir") {
        let newPath = currentPath.endsWith("/") ? currentPath + name : currentPath + "/" + name;
        loadDir(newPath);
    }
}

function goUp() {
    if (currentPath === "/") return;
    let parts = currentPath.split("/");
    parts.pop();
    let newPath = parts.join("/") || "/";
    loadDir(newPath);
}

function mkdir() {
    let name = prompt("Folder name:");
    if (!name) return;

    let path = currentPath.endsWith("/") ? currentPath + name : currentPath + "/" + name;
    api(`/mkdir_s?path=${encodeURIComponent(path)}`, () => loadDir());
}

function deleteItem(name) {
    if (!confirm("Delete? (recursive for folders)")) return;

    let path = currentPath.endsWith("/") ? currentPath + name : currentPath + "/" + name;
    api(`/delete_s?path=${encodeURIComponent(path)}`, () => loadDir());
}

function renameItem(name) {
    let newName = prompt("New name:", name);
    if (!newName) return;

    let oldPath = currentPath.endsWith("/") ? currentPath + name : currentPath + "/" + name;
    let newPath = currentPath.endsWith("/") ? currentPath + newName : currentPath + "/" + newName;

    api(`/rename_s?old=${encodeURIComponent(oldPath)}&new=${encodeURIComponent(newPath)}`, () => loadDir());
}

function downloadItem(name) {
    let path = currentPath.endsWith("/") ? currentPath + name : currentPath + "/" + name;
    window.location = `/download_s?file=${encodeURIComponent(path)}`;
}

function uploadFile() {
    let file = document.getElementById("uploadInput").files[0];
    if (!file) return alert("Selectează un fișier!");

    let form = new FormData();
    form.append("file", file);

    fetch(`/upload_s?path=${encodeURIComponent(currentPath)}`, {
        method: "POST",
        body: form
    })
    .then(r => r.text())
    .then(() => { alert("✔ Upload reușit!"); loadDir(); })
    .catch(() => alert("❌ Upload eșuat!"));
}

loadDir();
</script>

<br>
<div align="center">
    <button onclick="location.href='index.html'">&#127968; Home</button>
</div>
<script>
function updateStorageStatus() {
    fetch("/info_s")
        .then(r => r.json())
        .then(info => {
            document.getElementById("storageStatus").innerHTML =
                `<b>SD:</b> Used ${formatBytes(info.used)} / Free ${formatBytes(info.free)} / Total ${formatBytes(info.total)}`;
        })
        .catch(() => {
            document.getElementById("storageStatus").innerText = "Storage info unavailable";
        });
}

function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

updateStorageStatus();
</script>

    <script src="js/script.js"></script>

<button class="refresh-btn" onclick="location.reload()">&#128260;</button>
<!-- reset esp -->

<button style="width:42px;" class="reset-sticky" onclick="resetAndReload()">&#128260; RST</button>

<!-- end reset esp -->

</body>
</html>
